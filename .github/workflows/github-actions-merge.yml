name: GitHub Actions merge

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  unit-tests:
    name: Run Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up venv and run tests
        run: |
          cur_dir=$(pwd)/python_venv
          ./bash/setup_python_venv.bash $cur_dir cpu
          source $cur_dir/bin/activate
          pytest python/model-export/tests/test_export_model.py

  build-cpu-apptainer:
    name: Build CPU Apptainer image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Git LFS
        run: |
         git lfs install
         git lfs pull

      - name: Install Apptainer
        uses: eWaterCycle/setup-apptainer@v3
        with:
          apptainer-version: latest

      - name: Build container
        run: |
          #Build Apptainer image
          ./bash/setup_apptainer.bash cpu 10
          #Copy Needed data
          cp examples/PACKAGES/chemtrain-deploy/config.yaml apptainer
          cp examples/PACKAGES/chemtrain-deploy/tensorial-metal.ptb apptainer
          cp examples/PACKAGES/chemtrain-deploy/in.chemtrain-deploy-bulk-tensorial apptainer
          cd apptainer
          #Test Model Export
          apptainer run lammps-chemtrain.sif export -c config.yaml -ck last.cpkt
          #Test LAMMPS MD (Only do 1 run to save Github actions budget.)
          sed -i 's/^run             100$/run             1/' in.chemtrain-deploy-bulk-tensorial
          apptainer run lammps-chemtrain.sif lmp in.chemtrain-deploy-bulk-tensorial
