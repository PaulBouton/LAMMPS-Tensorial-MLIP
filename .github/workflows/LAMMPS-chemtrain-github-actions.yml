name: LAMMPS Chemtrain GitHub Actions

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  unit-tests:
    name: Run Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up venv and run tests
        run: |
          cur_dir=$(pwd)/python_venv
          ./bash/setup_python_venv.bash $cur_dir cpu
          source $cur_dir/bin/activate
          pytest python/model-export/tests/test_export_model.py

  build-cpu-apptainer:
    name: Build CPU Apptainer image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Git LFS
        run: |
         git lfs install
         git lfs pull

      - name: Install Apptainer
        uses: eWaterCycle/setup-apptainer@v3
        with:
          apptainer-version: latest

      - name: Build container
        run: |
          echo "Building Apptainer image"
          ./bash/setup_apptainer.bash cpu 10
          echo "Copying Needed data"
          cp examples/PACKAGES/chemtrain-deploy/config.yaml apptainer
          cp examples/PACKAGES/chemtrain-deploy/tensorial-metal.ptb apptainer
          cp examples/PACKAGES/chemtrain-deploy/in.chemtrain-deploy-bulk-tensorial apptainer
          cp examples/PACKAGES/chemtrain-deploy/last.ckpt apptainer
          cd apptainer
          sif_file=$(ls lammps-chemtrain*.sif)
          echo "Testing Model Export"
          apptainer run ${sif_file} export -c config.yaml -ck last.ckpt
          echo "Testing LAMMPS MD using exported MLIP"
          sed -i 's/^run             100$/run             10/' in.chemtrain-deploy-bulk-tensorial
          apptainer run ${sif_file} lmp in.chemtrain-deploy-bulk-tensorial
          echo "Done"

  build-LAMMMPS:
    name: Build LAMMPS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Git LFS
        run: |
         git lfs install
         git lfs pull

      - name: Build LAMMPS
        run: |
          echo "Setting up Python Virtual environment"
          ./bash/setup_python_venv.bash venv cpu
          echo "Installing OpenMPI"
          sudo apt-get update
          sudo apt-get install -y openmpi-bin libopenmpi-dev
          echo "Building LAMMPS"
          mkdir build && cd build
          cmake ../cmake --preset=chemtrain
          make -j $(nproc --all)

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        run: |
          shellcheck --severity=warning bash/*.bash
